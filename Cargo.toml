[package]
name = "wn-alerts"
version = "0.1.0"
edition = "2021"
description = "Multi-provider service status monitor with pluggable notifiers"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = "0.12"
rss = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
dotenvy = "0.15"
url = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
